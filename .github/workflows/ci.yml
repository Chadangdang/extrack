name: Build & Test

on:
  push:
    branches: [ "production", "dev" ]
  pull_request:
    branches: [ "production", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install dependencies
      run: npm install

    - name: Run lint
      run: npm run lint

    - name: Run tests
      run: npm test -- --ci --watchAll=false

    - name: Build project
      run: npm run build